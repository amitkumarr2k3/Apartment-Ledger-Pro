server {
  listen 80;
  server_name _;

  # Resolve upstream container names at request time instead of nginx startup,
  # so a slow/unhealthy backend doesn't crash nginx on boot.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream "http://api:4000";
  set $ssr_upstream "http://ssr:3000";

  # Dedicated healthcheck for the web container. Kept intentionally simple
  # (no upstream, no filesystem) so a wedged backend cannot flap web health.
  location = /health {
    access_log off;
    add_header Content-Type application/json;
    return 200 '{"ok":true,"service":"web"}';
  }

  # Fastify API
  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Everything else — TanStack Start SSR (node)
  location / {
    proxy_pass $ssr_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
  }
}

name: compose-smoke
on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Run smoke test
        id: smoke
        run: make smoke
        env:
          TIMEOUT: "180"
          READY_TIMEOUT: "240"
          LOG_LINES: "300"

      - name: Collect compose logs on failure
        if: failure()
        run: |
          mkdir -p compose-logs
          docker compose ps > compose-logs/ps.txt 2>&1 || true
          for s in api web db migrate mailhog; do
            docker compose logs --no-color --tail=1000 "$s" > "compose-logs/${s}.log" 2>&1 || true
          done
          # Also grab full logs (no tail) for deep triage.
          docker compose logs --no-color > compose-logs/all-services.log 2>&1 || true
          ls -la compose-logs

      - name: Upload compose logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: compose-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose down -v
